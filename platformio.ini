; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
lib_dir = .
src_dir = examples/test

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino

; Tests
; Ignore Unity library to avoid scanning .pio/libdeps/Unity/examples/ as part of lib_dir = .
; Add Unity src path manually so unity.h is still found during test compilation
lib_ignore = Unity

; Serial monitor
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
  esp32_exception_decoder
  log2file

; Flags
build_flags =
  ; All warning as errors
  -Wall
  -Wextra
  -Werror

  ; LoRa test module
  -DLORA_E22_900_30DBM

  ; Enable debug (ESP-IDF logs)
  -DUSE_ESP_IDF_LOG
  -DCORE_DEBUG_LEVEL=5
  -DCONFIG_LOG_COLORS

[env:esp32-s3-single]
extends = common
board = esp32-s3-devkitc-1
upload_port = COM4
test_port = COM4
test_filter = test_single
build_flags =
  ${common.build_flags}
  -I.pio/libdeps/esp32-s3-single/Unity/src
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-dual-sender]
extends = common
board = esp32-s3-devkitc-1
upload_port = COM4
test_port = COM4
test_filter = test_dual_sender
build_flags =
  ${common.build_flags}
  -I.pio/libdeps/esp32-s3-dual-sender/Unity/src
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3-dual-receiver]
extends = common
board = esp32-c3-devkitm-1
upload_port = COM11
test_port = COM11
test_filter = test_dual_receiver
build_flags =
  ${common.build_flags}
  -I.pio/libdeps/esp32-c3-dual-receiver/Unity/src