<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">

  <defs>
    <!-- Cylindrical shading: highlight left, shadow right -->
    <linearGradient id="antGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#BBEEFF"/>
      <stop offset="22%"  stop-color="#00D4FF"/>
      <stop offset="65%"  stop-color="#009EC4"/>
      <stop offset="100%" stop-color="#003D55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="#0D1117" rx="16"/>

  <!-- Expanding waves from tip (150, 52).
       r max=40 -> extremes: left=110, right=190, top=12, bottom=92. All inside 300x300. -->
  <circle cx="150" cy="52" r="8" fill="none" stroke="#00D4FF" stroke-width="1.8">
    <animate attributeName="r"       from="8"    to="40"  dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.85"  to="0"   dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="52" r="8" fill="none" stroke="#00D4FF" stroke-width="1.8">
    <animate attributeName="r"       from="8"    to="40"  dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.85"  to="0"   dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="52" r="8" fill="none" stroke="#00D4FF" stroke-width="1.8">
    <animate attributeName="r"       from="8"    to="40"  dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.85"  to="0"   dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="52" r="8" fill="none" stroke="#00D4FF" stroke-width="1.8">
    <animate attributeName="r"       from="8"    to="40"  dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.85"  to="0"   dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Antenna rod: tip at y=54, bottom at y=178 -->
  <rect x="146" y="54" width="8" height="124" rx="4" fill="url(#antGrad)"/>
  <!-- Highlight stripe (left 30%, simulates round surface) -->
  <rect x="147.5" y="56" width="2" height="120" rx="1" fill="white" opacity="0.2"/>

  <!-- Feed connector (slightly wider, at base of rod) -->
  <rect x="143" y="178" width="14" height="14" rx="4" fill="url(#antGrad)"/>

  <!-- Ground plane -->
  <rect x="95"  y="192" width="110" height="7" rx="3" fill="#00D4FF" opacity="0.72"/>
  <!-- Ground plane top highlight -->
  <rect x="97"  y="192" width="106" height="2" rx="1" fill="white"   opacity="0.14"/>

  <!-- Tip dot (pulses with wave) -->
  <circle cx="150" cy="52" r="4.5" fill="#00D4FF">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Text: centered on x=150 -->
  <text x="150" y="240"
    font-family="Consolas,'Courier New',monospace"
    font-size="40" font-weight="700"
    fill="#00D4FF" text-anchor="middle" letter-spacing="2">LoRa</text>

  <text x="150" y="263"
    font-family="Consolas,'Courier New',monospace"
    font-size="15"
    fill="#2A8FAA" text-anchor="middle" letter-spacing="2">E22-T Series</text>

  <text x="150" y="282"
    font-family="Consolas,'Courier New',monospace"
    font-size="10"
    fill="#1A4A5A" text-anchor="middle" letter-spacing="4">Arduino Library</text>

</svg>
